data_dir: /data
media_roots:
  - /media/movies
  - /media/tv

server:
  listen: 0.0.0.0:8097

instances:
  - name: sonarr-main
    type: sonarr
    url: http://sonarr:8989
    api_key: ${SONARR_MAIN_API_KEY}
    webhook_token: ${SONARR_MAIN_WEBHOOK_TOKEN}
    path_mappings:
      - remote: /data/tv
        local: /media/tv
  - name: radarr-main
    type: radarr
    url: http://radarr:7878
    api_key: ${RADARR_MAIN_API_KEY}
    webhook_token: ${RADARR_MAIN_WEBHOOK_TOKEN}
    path_mappings:
      - remote: /data/movies
        local: /media/movies

providers:
  titlovi-main:
    type: titlovi
    username: ${TITLOVI_USERNAME}
    password: ${TITLOVI_PASSWORD}
    requests_per_second: 1
    burst: 1
    max_concurrent: 1
    max_pages: 5
  opensubtitles-main:
    type: opensubtitles
    api_key: ${OPENSUBTITLES_API_KEY}
    username: ${OPENSUBTITLES_USERNAME}
    password: ${OPENSUBTITLES_PASSWORD}
    user_agent: subsyncd
    requests_per_second: 1
    burst: 1
    max_concurrent: 1
  subdl-main:
    type: subdl
    api_key: ${SUBDL_API_KEY}
    requests_per_second: 1
    burst: 1
    max_concurrent: 1

provider_http:
  shared_origin_max_concurrent: 1

languages:
  hr:
    providers:
      - titlovi-main
  en:
    providers:
      - opensubtitles-main
      - subdl-main

allow_hearing_impaired: true
minimum_release_score: 35

pack_cache:
  ttl: 24h
  max_bytes: 536870912

sync:
  lapse_path: /usr/local/bin/lapse
  timeout: 30m

silo:
  enabled: false
  # Silo's Jellyfin-compatible listener, not its web UI listener.
  url: http://silo:8096
  api_key: ${SILO_API_KEY}
  path_mappings:
    - from: /media
      to: /mnt/media
